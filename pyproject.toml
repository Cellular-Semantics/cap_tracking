[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cap_tracking"
version = "0.1.0"
description = "Tracker for CAP ontology-mapping findings: CAP-website edits and Cell Ontology NTR issues."
requires-python = ">=3.12,<4.0"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
